name: voicepin
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Map
  google_maps_flutter: ^2.5.0
  
  # Location
  geolocator: ^10.1.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Audio Recording
  flutter_sound: ^9.2.13
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true